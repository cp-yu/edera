services:
  edera-server:
    build: .
    command: ["edera-server", "--config-dir", "/app/config"]
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - ./config:/app/config
      - ./skills:/app/skills
    ports:
      - "9090:9090"
    restart: unless-stopped
  edera-web:
    build: .
    command: ["edera-web"]
    environment:
      EDERA_SERVER_ADDR: 127.0.0.1:9090
    network_mode: "service:edera-server"
    depends_on:
      - edera-server
    restart: unless-stopped
