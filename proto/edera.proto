syntax = "proto3";

package edera.v1;

service EntityService {
  rpc Get(EntityRef) returns (Entity);
  // EntityService.List
  rpc List(EntityQuery) returns (EntityList);
  // EntityService.Query
  rpc Query(QueryRequest) returns (EntityList);
  rpc Create(Entity) returns (Entity);
  rpc Update(Entity) returns (Entity);
  rpc Delete(EntityRef) returns (DeleteResult);
  rpc Import(JsonRequest) returns (JsonResponse);
  rpc Export(EntityQuery) returns (JsonResponse);
  rpc Materialize(JsonRequest) returns (JsonResponse);
}

service DagService {
  rpc Run(DagRunRequest) returns (DagRunRef);
  rpc Status(DagRef) returns (DagStatus);
  rpc Edit(DagEditRequest) returns (DagStatus);
  rpc Stop(DagStopRequest) returns (JsonResponse);
  rpc Retry(DagRetryRequest) returns (JsonResponse);
}

service NodeService {
  rpc Status(NodeRef) returns (NodeStatus);
  rpc Stop(NodeRef) returns (NodeStatus);
  rpc Resume(NodeResumeRequest) returns (DagRunRef);
  rpc Output(NodeOutputRequest) returns (NodeOutputList);
}

service SystemService {
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc InitClient(ClientInitRequest) returns (ClientInitResponse);
  rpc SubscribeEvents(EventSubscribeRequest) returns (stream EventMessage);
  rpc PauseScheduler(EmptyRequest) returns (JsonResponse);
  rpc ResumeScheduler(EmptyRequest) returns (JsonResponse);
  rpc SchedulerStatus(EmptyRequest) returns (JsonResponse);
  rpc CreateRepairTask(NameRequest) returns (JsonResponse);
}

service GraphService {
  rpc ListDags(EmptyRequest) returns (JsonResponse);
  rpc GetDag(NameRequest) returns (JsonResponse);
  rpc CreateDag(NameRequest) returns (JsonResponse);
  rpc SaveDag(NamedJsonRequest) returns (JsonResponse);
  rpc CreateDagNode(NamedJsonRequest) returns (JsonResponse);
  rpc ListNodeTypes(EmptyRequest) returns (JsonResponse);
  rpc GetNodeType(NameRequest) returns (JsonResponse);
  rpc CreateNodeType(NamedJsonRequest) returns (JsonResponse);
  rpc SaveNodeType(NamedJsonRequest) returns (JsonResponse);
  rpc DeleteNodeType(NameRequest) returns (JsonResponse);
  rpc ListSkills(EmptyRequest) returns (JsonResponse);
  rpc CreateSkill(JsonRequest) returns (JsonResponse);
  rpc SaveSkill(NamedJsonRequest) returns (JsonResponse);
  rpc DeleteSkill(NameRequest) returns (JsonResponse);
  rpc GetHandler(NameRequest) returns (JsonResponse);
  rpc SaveHandler(NamedTextRequest) returns (JsonResponse);
  rpc ListHandlers(EmptyRequest) returns (JsonResponse);
  rpc RuntimeStatus(RuntimeStatusRequest) returns (JsonResponse);
}

service ConfigService {
  rpc ListConfigs(EmptyRequest) returns (JsonResponse);
  rpc ReadSystemConfig(EmptyRequest) returns (JsonResponse);
  rpc SaveSystemConfig(TextRequest) returns (JsonResponse);
  rpc ReadConfig(ConfigFileRequest) returns (JsonResponse);
  rpc SaveConfig(ConfigFileContentRequest) returns (JsonResponse);
  rpc ReadEntitiesConfig(EmptyRequest) returns (JsonResponse);
  rpc SaveEntitiesConfig(JsonRequest) returns (JsonResponse);
  rpc ListEntityTypes(EmptyRequest) returns (JsonResponse);
  rpc ReloadEntityTypes(EmptyRequest) returns (JsonResponse);
  rpc CreateEntityType(ConfigFileContentRequest) returns (JsonResponse);
  rpc GetEntityType(NameRequest) returns (JsonResponse);
  rpc SaveEntityType(ConfigFileContentRequest) returns (JsonResponse);
  rpc DeleteEntityType(DeleteEntityTypeRequest) returns (JsonResponse);
  rpc ReadEntityRelationsConfig(EmptyRequest) returns (JsonResponse);
  rpc SaveEntityRelationsConfig(JsonRequest) returns (JsonResponse);
  rpc CreateEntityRelation(JsonRequest) returns (JsonResponse);
  rpc DeleteEntityRelation(NameRequest) returns (JsonResponse);
}

service QueryService {
  rpc LatestBriefing(EmptyRequest) returns (JsonResponse);
  rpc ListBriefings(TimeRangeRequest) returns (JsonResponse);
  rpc GetBriefing(NameRequest) returns (JsonResponse);
  rpc ListAdvices(AdviceQueryRequest) returns (JsonResponse);
  rpc GetAdvice(NameRequest) returns (JsonResponse);
  rpc ResultsSummary(AdviceQueryRequest) returns (JsonResponse);
  rpc SourceHealth(EmptyRequest) returns (JsonResponse);
  rpc SourceLogs(SourceLogsRequest) returns (JsonResponse);
  rpc NodeOutputs(NodeOutputsRequest) returns (JsonResponse);
  rpc NodeLogs(NodeOutputsRequest) returns (JsonResponse);
  rpc NodeHistory(NodeHistoryRequest) returns (JsonResponse);
  rpc ChildRunForParent(ParentChildRunRequest) returns (JsonResponse);
}

service EventService {
  rpc Emit(EmitRequest) returns (JsonResponse);
}

service ExtensionService {
  rpc ListAvailable(EmptyRequest) returns (JsonResponse);
  rpc ListInstalled(EmptyRequest) returns (JsonResponse);
  rpc Show(NameRequest) returns (JsonResponse);
  rpc Install(NameRequest) returns (JsonResponse);
  rpc Uninstall(NamedJsonRequest) returns (JsonResponse);
  rpc Reactivate(NameRequest) returns (JsonResponse);
}

message EmptyRequest {}

message NameRequest {
  string name = 1;
}

message TextRequest {
  string content = 1;
}

message JsonRequest {
  string json = 1;
}

message NamedJsonRequest {
  string name = 1;
  string json = 2;
}

message NamedTextRequest {
  string name = 1;
  string content = 2;
}

message JsonResponse {
  string json = 1;
}

message ConfigFileRequest {
  string kind = 1;
  string name = 2;
}

message ConfigFileContentRequest {
  string kind = 1;
  string name = 2;
  string content = 3;
}

message DeleteEntityTypeRequest {
  string name = 1;
  bool cascade = 2;
}

message TimeRangeRequest {
  string created_from = 1;
  string created_to = 2;
  int32 limit = 3;
}

message AdviceQueryRequest {
  string stock_code = 1;
  string direction = 2;
  string created_from = 3;
  string created_to = 4;
  int32 limit = 5;
}

message SourceLogsRequest {
  string source_name = 1;
  int32 limit = 2;
}

message NodeOutputsRequest {
  string node_id = 1;
  string run_id = 2;
  int32 limit = 3;
}

message NodeHistoryRequest {
  string dag_name = 1;
  string node_id = 2;
  int32 limit = 3;
}

message RuntimeStatusRequest {
  string run_id = 1;
}

message ParentChildRunRequest {
  string parent_run_id = 1;
  string parent_node_id = 2;
}

message DagStopRequest {
  string dag_name = 1;
  bool force = 2;
}

message DagRetryRequest {
  string dag_name = 1;
  string run_id = 2;
  repeated string node_ids = 3;
  string mode = 4;
  string payload_json = 5;
}

message EmitRequest {
  string event = 1;
  string payload_json = 2;
  string source = 3;
  int32 depth = 4;
}

message EntityRef {
  string ref = 1;
  bool force = 2;
}

message EntityQuery {
  string type = 1;
  string filters_json = 2;
  string dag_run_id = 3;
}

message QueryRequest {
  string expression = 1;
  string identity = 2;
}

message Entity {
  string id = 1;
  string type = 2;
  string json = 3;
}

message EntityList {
  repeated Entity entities = 1;
}

message DeleteResult {
  bool deleted = 1;
}

message DagRef {
  string name = 1;
}

message DagRunRequest {
  string name = 1;
  string inputs_json = 2;
}

message DagRunRef {
  string run_id = 1;
}

message DagStatus {
  string name = 1;
  string json = 2;
}

message DagEditRequest {
  string name = 1;
  string operation = 2;
  string json = 3;
}

message NodeRef {
  string id = 1;
}

message NodeStatus {
  string id = 1;
  string status = 2;
}

message NodeResumeRequest {
  string id = 1;
  string run_id = 2;
  string prompt = 3;
}

message NodeOutputRequest {
  string id = 1;
  string run_id = 2;
}

message NodeOutputList {
  string json = 1;
}

message HealthRequest {}

message HealthResponse {
  bool ok = 1;
}

message ReloadRequest {}

message ReloadResponse {
  bool reloaded = 1;
}

message ClientInitRequest {
  string common_name = 1;
}

message ClientInitResponse {
  string client_cert_pem = 1;
  string client_key_pem = 2;
  string ca_cert_pem = 3;
}

message EventSubscribeRequest {
  string node_id = 1;
  string dag_name = 2;
}

message EventMessage {
  string type = 1;
  string json = 2;
}
