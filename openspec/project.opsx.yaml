schema_version: 1
domains:
  - name: web
    description: 本机 Web 控制台 — 页面、API、本机访问边界
    capabilities:
      - id: local-web-console
        description: 仅本机访问的 Web 控制台，覆盖导航、页面渲染、HTTP API 和本地访问边界
        spec: specs/local-web-console/spec.md
      - id: result-explorer
        description: 结果浏览能力，覆盖简报、建议、分析、原文和失败信息的查询与展示
        spec: specs/result-explorer/spec.md
      - id: dag-workbench-ui
        description: DAG 工作台 UI，覆盖画布交互、节点拖拽、连线管理、自动布局和 Inspector 配置
        spec: specs/dag-workbench-ui/spec.md
      - id: canvas-interaction-enhancement
        description: 画布交互增强，覆盖连线视觉、右键菜单、对齐辅助线、细粒度网格吸附和撤销重做
        spec: specs/canvas-interaction-enhancement/spec.md
      - id: node-visual-system
        description: 节点视觉系统，覆盖类型差异化外观、动态 Handle、运行状态 badge 和分组可视化
        spec: specs/node-visual-system/spec.md
      - id: graph-layout-engine
        description: 图布局引擎，覆盖 ELK 自动布局、全局视口拟合、缩放边界和执行路径高亮
        spec: specs/graph-layout-engine/spec.md
      - id: node-graph-dag-editor
        description: Node Graph DAG 编辑器，覆盖图编辑交互、DAG 保存、Inspector 配置和运行状态覆盖
        spec: specs/node-graph-dag-editor/spec.md
      - id: node-instance-model
        description: 节点实例化模型，覆盖 UUID 标识、别名、实例级配置和多实例支持
        spec: specs/node-instance-model/spec.md
  - name: operations
    description: 管道操作面 — 调度控制、手动运行、停止运行和状态记录
    capabilities:
      - id: pipeline-control
        description: 管道控制能力，覆盖手动运行、暂停/恢复调度、停止当前运行、运行状态与运行记录
        spec: specs/pipeline-control/spec.md
      - id: node-executor
        description: 节点执行器，覆盖实例调度、handler 加载、实体上下文注入和权限检查
        spec: specs/node-executor/spec.md
  - name: advisory
    description: 交易建议域 — 建议生成、历史复盘与建议质量评估
    capabilities:
      - id: trade-advisory
        description: 交易建议能力，覆盖建议生成、审计字段与历史建议价格复盘
        spec: specs/trade-advisory/spec.md
  - name: config
    description: 配置管理域 — 分层配置体系与运行时编辑
    capabilities:
      - id: runtime-config-editing
        description: 运行时配置编辑能力，覆盖 portfolio/system/node/dag/skill 配置读取、校验、保存与错误反馈
        spec: specs/runtime-config-editing/spec.md
  - name: data
    description: 数据层 — 共享模型与持久化
    capabilities:
      - id: data-models
        description: 共享数据模型，覆盖 RawItem、AnalysisResult、Advice、Briefing 和迁移脚本
        spec: specs/data-models/spec.md
capabilities:
  - id: cap.entity-management-page
    intent: 实体管理独立页面，覆盖类型/实例/关系三个 tab 的 CRUD 交互、schema-driven 表单和级联删除确认
    type: capability
  - id: cap.entity-type-crud-api
    intent: Entity Type 后端 CRUD API，覆盖创建/读取/更新/删除类型定义文件，含 cascade 删除参数
    type: capability
  - id: cap.entity-instance-crud-api
    intent: Entity Instance 单条 CRUD API，复用 EntityStore 逻辑
    type: capability
  - id: cap.entity-relation-crud-api
    intent: Entity Relation 单条 CRUD API，关系加 UUID 标识
    type: capability
