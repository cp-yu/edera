schema_version: 1
project:
  id: proj.stockimformation
  name: stockImformation
  intent: 个人股票信息管道，覆盖本机 Web 控制台、配置管理、数据持久化、DAG 运行和交易建议能力
  scope: 覆盖 stockImformation 应用、配置、运行时管道、Web API 和 OpenSpec 跟踪制品
  roots:
    - path: .
domains:
  - id: dom.web
    intent: 本机 Web 控制台 — 页面、API、本机访问边界
    type: domain
    boundary: 拥有 Web 控制台、API 和前端交互，不拥有管道执行逻辑
  - id: dom.operations
    intent: 管道操作面 — 调度控制、手动运行、停止运行和状态记录
    type: domain
    boundary: 拥有运行控制、调度状态和节点执行编排
  - id: dom.advisory
    intent: 交易建议域 — 建议生成、历史复盘与建议质量评估
    type: domain
    boundary: 拥有交易建议和建议质量评估，不拥有原始采集配置
  - id: dom.config
    intent: 配置管理域 — 分层配置体系与运行时编辑
    type: domain
    boundary: 拥有配置读取、校验、编辑和持久化
  - id: dom.data
    intent: 数据层 — 共享模型与持久化
    type: domain
    boundary: 拥有数据模型、数据库表、迁移和查询接口
  - id: dom.core
    intent: 核心实体与运行时编排域，承载统一 Entity、DAG、Trigger 和配置安全能力
    type: domain
    boundary: 拥有统一 Entity 原语、DAG/Trigger 编排和跨层运行时能力
capabilities:
  - id: cap.web.local-web-console
    intent: 仅本机访问的 Web 控制台，覆盖导航、页面渲染、HTTP API 和本地访问边界
    type: capability
    domain: dom.web
  - id: cap.web.result-explorer
    intent: 结果浏览能力，覆盖统一输出 Entity 下的简报、建议、分析、原文、失败信息、字符串深链标识和错误/空态展示
    type: capability
    domain: dom.web
  - id: cap.web.dag-workbench-ui
    intent: DAG 工作台 UI，覆盖画布交互、节点拖拽、连线管理、自动布局、Inspector 配置、按已选实体过滤的权限配置器和按 entity type 分组的底部 entity 过滤器
    type: capability
    domain: dom.web
  - id: cap.web.canvas-interaction-enhancement
    intent: 画布交互增强，覆盖连线视觉、右键菜单、对齐辅助线、细粒度网格吸附和撤销重做
    type: capability
    domain: dom.web
  - id: cap.web.node-visual-system
    intent: 节点视觉系统，覆盖类型差异化外观、动态 Handle、运行状态 badge 和分组可视化
    type: capability
    domain: dom.web
  - id: cap.web.graph-layout-engine
    intent: 图布局引擎，覆盖 ELK 自动布局、全局视口拟合、缩放边界和执行路径高亮
    type: capability
    domain: dom.web
  - id: cap.web.node-graph-dag-editor
    intent: Node Graph DAG 编辑器，覆盖图编辑交互、DAG 保存、Inspector 配置和运行状态覆盖
    type: capability
    domain: dom.web
  - id: cap.web.node-instance-model
    intent: 节点实例化模型，覆盖 UUID 标识、别名、实例级配置（含 session_dir、tools、model）和多实例支持
    type: capability
    domain: dom.web
  - id: cap.operations.pipeline-control
    intent: 管道控制能力，覆盖运行记录（含 retry_of 关联）、手动/重试触发、soft/hard stop 和状态展示
    type: capability
    domain: dom.operations
  - id: cap.operations.node-executor
    intent: 节点执行器，统一为 function node 执行路径，支持 tools 白名单传递、RIG_IDENTITY 环境变量注入、session_dir 解析与自动 --continue 判定
    type: capability
    domain: dom.operations
  - id: cap.advisory.trade-advisory
    intent: 交易建议能力，覆盖建议生成、审计字段与历史建议价格复盘
    type: capability
    domain: dom.advisory
  - id: cap.config.runtime-config-editing
    intent: 运行时配置编辑能力，覆盖 portfolio/system/node/dag/skill 配置读取、校验、保存与错误反馈
    type: capability
    domain: dom.config
  - id: cap.data.data-models
    intent: 共享数据模型，覆盖 RawItem、AnalysisResult、Advice、Briefing 和迁移脚本
    type: capability
    domain: dom.data
  - id: cap.entity-management-page
    intent: 实体管理页面适配统一 Entity 模型，支持所有 EntityType（含 Node、DAG、Trigger）的 CRUD 交互
    type: capability
    domain: dom.core
  - id: cap.entity-type-crud-api
    intent: Entity Type CRUD API 扩展，支持 storage_tier、能力字段声明和 system_protected 保护检查
    type: capability
    domain: dom.core
  - id: cap.entity-instance-crud-api
    intent: Entity Instance CRUD API 适配三层存储路由
    type: capability
    domain: dom.core
  - id: cap.entity-relation-crud-api
    intent: "Entity Relation 统一为 Entity（type: relation），通过 Entity Store 管理"
    type: capability
    domain: dom.core
  - id: cap.unified-entity-model
    intent: 统一 Entity 原语，EntityType 注册来源扩展为 manifest 声明 + 用户配置覆盖的双层优先级
    type: capability
  - id: cap.entity-storage-tiers
    intent: Entity 三层存储（文件系统/数据库/内存），含 retention 策略和生命周期管理
    type: capability
  - id: cap.trigger-system
    intent: Trigger Entity 类型与 Trigger Executor 内核，支持时间/事件/用户/叠加触发，FreeRTOS 事件组 AND/OR 组合
    type: capability
  - id: cap.dag-condition-branch
    intent: DAG edge 条件分支，可替换 condition evaluator handler，支持 output.* + entity ref + 常量
    type: capability
  - id: cap.single-node-loop
    intent: 单节点并行循环（同输入多实例）和串行循环（迭代精炼），停止条件为固定次数或条件满足
    type: capability
  - id: cap.sub-dag-execution
    intent: 子 DAG 作为 Node 嵌套执行，对外黑盒，递归上限可配置
    type: capability
  - id: cap.config-git-safety
    intent: 配置文件夹强制 git 版本管理，DAG run 结束自动 commit，操作互斥锁
    type: capability
  - id: cap.entity-type-protection
    intent: 系统内核 entity type 的保护机制，覆盖 system_protected 字段声明、后端 403 拒绝和前端只读展示
    type: capability
  - id: cap.core.extension-manifest-system
    intent: 扩展 manifest 声明、解析、校验和文件名 fallback 机制，提供 NodeTypeDescriptor 提取和依赖校验
    type: capability
  - id: cap.core.core-bootstrap
    intent: 核心启动时扫描扩展目录、解析 manifest、构建 handler registry 和 entity type registry、设置 module path
    type: capability
  - id: cap.core.handler-context-protocol
    intent: 统一 HandlerContext 单参数调用协议、HandlerProtocol 和 EntityStoreProtocol 接口定义，承载于独立 core-types 包
    type: capability
  - id: cap.core.extension-declarative-storage
    intent: 扩展通过 manifest 声明自定义数据库表，核心自动建表并提供命名空间隔离
    type: capability
  - id: cap.operations.dag-event-driven-executor
    intent: 事件驱动 DAG 调度器，覆盖 dispatcher 调度、fan-in barrier/accumulate 模式、错误路径隔离、resource semaphore gate 和执行结果收集
    type: capability
  - id: cap.operations.dag-run-control
    intent: DAG 运行控制能力，覆盖 soft stop（asyncio.Event）、hard stop（task.cancel）和节点重试（single/cascade mode，支持多节点批量）
    type: capability
  - id: cap.web.dag-run-observability
    intent: DAG 运行能观性，覆盖 Inspector Runtime tab、edge 数据流查看和节点历史页面
    type: capability
  - id: cap.web.dag-creation
    intent: DAG 创建能力，覆盖前端 dialog 交互和后端 API 创建空 DAG 配置文件
    type: capability
  - id: cap.web.dag-cycle-detection-ui
    intent: 前端环检测，覆盖 onConnect DFS 校验和 toast 警告
    type: capability
  - id: cap.core.rig-cli
    intent: Rig CLI binary，提供 entity/node/dag 子命令，支持双身份模式（agent/human），权限继承 entity_permissions
    type: capability
    domain: dom.core
  - id: cap.operations.llm-session-reuse
    intent: LLM 节点 session 复用机制，覆盖 sandbox 路径管理、session_dir 引用解析、resume 判定和 TTL 清理
    type: capability
    domain: dom.operations
  - id: cap.operations.llm-node-intervention
    intent: LLM 节点侵入式干预，覆盖 stop + resume with prompt 的完整流程
    type: capability
    domain: dom.operations
  - id: cap.operations.reflection-dag-pattern
    intent: 反思 DAG 模式，覆盖 cron + idle 触发、session resume、skill 自优化闭环
    type: capability
    domain: dom.operations
  - id: cap.operations.multi-node-retry
    intent: 多节点批量重试能力，覆盖 API 参数泛化、多起点拓扑调度、prefilled 数据加载和前端批量选择交互
    type: capability
  - id: cap.core.dag-resource-semaphore
    intent: DAG 节点资源信号量约束，覆盖 Resource Entity 定义、节点 resource 声明、DagRunner acquire/release 调度逻辑和跨 DAG 共享语义
    type: capability
