schema_version: 1
project:
  id: proj.edera
  name: Edera
  intent: 以 Entity 为统一原语、以 DAG 为执行模型的通用编排内核，覆盖本机 Web 控制台、配置管理、数据持久化、DAG 运行和控制面能力
  scope: 覆盖 Edera 应用、配置、运行时管道、Web API 和 OpenSpec 跟踪制品
  roots:
    - path: .
domains:
  - id: dom.web
    intent: 本机 Web 控制台 — 页面、API、本机访问边界
    type: domain
    boundary: 拥有 Web 控制台、API 和前端交互，不拥有管道执行逻辑
  - id: dom.operations
    intent: 管道操作面 — 调度控制、手动运行、停止运行和状态记录
    type: domain
    boundary: 拥有运行控制、调度状态和节点执行编排
  - id: dom.advisory
    intent: 交易建议域 — 建议生成、历史复盘与建议质量评估
    type: domain
    boundary: 拥有交易建议和建议质量评估，不拥有原始采集配置
  - id: dom.config
    intent: 配置管理域 — 分层配置体系与运行时编辑
    type: domain
    boundary: 拥有配置读取、校验、编辑和持久化
  - id: dom.data
    intent: 数据层 — 共享模型与持久化
    type: domain
    boundary: 拥有数据模型、数据库表、迁移和查询接口
  - id: dom.core
    intent: 核心实体与运行时编排域，承载统一 Entity、DAG、Trigger 和配置安全能力
    type: domain
    boundary: 拥有统一 Entity 原语、DAG/Trigger 编排和跨层运行时能力
capabilities:
  - id: cap.web.local-web-console
    intent: edera-web 纯 BFF HTTP API 服务器，--bind/--port flag 优先 + EDERA_WEB_BIND/PORT env fallback，default 127.0.0.1:8000，FastAPI/OpenAPI title 使用 Edera，不读 system.toml web 字段
    type: capability
    domain: dom.web
  - id: cap.web.result-explorer
    intent: 结果浏览能力，覆盖统一输出 Entity 下的简报、建议、分析、原文、失败信息、metadata bar、历史简报、字符串深链标识和错误/空态展示
    type: capability
    domain: dom.web
  - id: cap.web.dag-workbench-ui
    intent: DAG 工作台 UI 支持恢复上次选中的 DAG、节点面板搜索与临时折叠，并保留既有三栏、Inspector、Triggers tab 和 React Flow 图编辑交互
    type: capability
    domain: dom.web
  - id: cap.web.canvas-interaction-enhancement
    intent: 画布交互增强，覆盖连线视觉、右键菜单、对齐辅助线、细粒度网格吸附、撤销重做和选中节点一跳连线高亮及无关连线弱化
    type: capability
    domain: dom.web
  - id: cap.web.node-visual-system
    intent: 节点视觉系统，覆盖 alias 优先的 Canvas 节点标题、类型差异化外观、动态 Handle、运行状态 badge 和分组可视化
    type: capability
    domain: dom.web
  - id: cap.web.graph-layout-engine
    intent: 图布局引擎，覆盖 ELK 自动布局、全局视口拟合、缩放边界和执行路径高亮
    type: capability
    domain: dom.web
  - id: cap.web.node-graph-dag-editor
    intent: Node Graph DAG 编辑器，覆盖图编辑交互、DAG 保存、Inspector 配置和运行状态覆盖
    type: capability
    domain: dom.web
  - id: cap.web.node-instance-model
    intent: 节点实例化模型，覆盖 UUID 标识、别名、实例级配置（含 session_dir、tools、model）和多实例支持
    type: capability
    domain: dom.web
  - id: cap.operations.dag-control
    intent: 管道控制能力，废弃 APScheduler interval 调度，统一由 TriggerExecutor 驱动；DAG 运行 API 通过 emit 路径
    type: capability
    domain: dom.operations
  - id: cap.operations.node-executor
    intent: 节点执行器，按 NodeConfig type 分发执行；agent subprocess 注入 EDERA_IDENTITY，session 路径基于 EDERA_DATA_DIR/sessions/ 由 server 决定绝对路径
    type: capability
    domain: dom.operations
  - id: cap.advisory.trade-advisory
    intent: 交易建议能力，覆盖建议生成、审计字段与历史建议价格复盘
    type: capability
    domain: dom.advisory
  - id: cap.config.runtime-config-editing
    intent: 运行时配置编辑能力，覆盖 portfolio/system/node/dag/skill 配置读取、校验、保存与错误反馈
    type: capability
    domain: dom.config
  - id: cap.data.data-models
    intent: 共享数据模型，覆盖 DagRun、NodeRun、NodeOutput、EdgeInput、RawItem、AnalysisResult、Advice、Briefing 和迁移脚本，统一使用 run_id 标识执行实例
    type: capability
    domain: dom.data
  - id: cap.entity-management-page
    intent: 实体管理页面适配统一 Entity 模型，支持所有 EntityType（含 Node、DAG、Trigger）的 CRUD 交互
    type: capability
    domain: dom.core
  - id: cap.entity-type-crud-api
    intent: Entity Type CRUD API，cascade delete 降低事务性承诺为顺序持久化
    type: capability
    domain: dom.core
  - id: cap.entity-instance-crud-api
    intent: "Entity Instance CRUD API 适配三层存储路由，GET /api/entities 返回 {entities: [...]} 包装格式，entity payload 包含 display 字段（按 EntityType display_template 渲染），写操作完成后 emit event:entity-changed:{ref}"
    type: capability
    domain: dom.core
  - id: cap.entity-relation-crud-api
    intent: "Entity Relation 统一为 Entity（type: relation），GET /api/entity-relations 返回 {relations: [...]} 包装格式并转换为 {id, entities, type, metadata} 结构，GET /api/entity-relations/types 返回 {types: [...]} 包装格式，type=relation 查询正确路由，通过 Entity Store 管理"
    type: capability
    domain: dom.core
  - id: cap.unified-entity-model
    intent: 统一 Entity 原语扩展 EntityType DB-backed metadata，覆盖 schema version、table mapping、materialized fields 和 deprecated fields
    type: capability
  - id: cap.entity-storage-tiers
    intent: Entity 三层存储中核心配置型 Entity 迁移为 DB-backed per-type tables，YAML 仅作为 import/export/template 格式；输出型 Entity 和瞬态 Entity 边界保持独立
    type: capability
  - id: cap.trigger-system
    intent: Trigger Entity 使用自由布尔表达式 wait_for，支持 enabled 字段、clear:event:* target 与 fire 后自动 consume
    type: capability
  - id: cap.dag-condition-branch
    intent: DAG edge 条件分支，可替换 condition evaluator handler，支持 output.* + entity ref + 常量
    type: capability
  - id: cap.single-node-loop
    intent: 单节点并行循环（同输入多实例）和串行循环（迭代精炼），停止条件为固定次数或条件满足
    type: capability
  - id: cap.sub-dag-execution
    intent: 子 DAG 作为 Node 嵌套执行，对外黑盒，递归上限可配置
    type: capability
  - id: cap.config-git-safety
    intent: 配置文件夹强制 git 版本管理，DAG run 结束自动 commit，操作互斥锁
    type: capability
  - id: cap.entity-type-protection
    intent: 系统内核 entity type 的保护机制，覆盖 system_protected 字段声明、后端 403 拒绝和前端只读展示
    type: capability
  - id: cap.core.extension-manifest-system
    intent: 扩展 manifest 声明、解析、校验和文件名 fallback 机制，提供 NodeTypeDescriptor 提取和依赖校验
    type: capability
  - id: cap.core.core-bootstrap
    intent: 核心 bootstrap 和启动入口迁移到 Edera 命名，核心包为 edera_core，项目主入口命令为 edera
    type: capability
  - id: cap.core.handler-context-protocol
    intent: HandlerContext 增加 runtime API，用于 source fetcher 等 handler 显式记录运行期事实
    type: capability
  - id: cap.core.extension-declarative-storage
    intent: 扩展声明表继续使用 ext_ 命名空间，并与普通 EntityType 的 entity_ per-type table DDL 和列类型契约保持兼容
    type: capability
  - id: cap.operations.dag-event-driven-executor
    intent: dispatcher 将 wait 节点作为常规 Task 调度，挂起不阻塞主循环与独立路径，stop 时可取消挂起
    type: capability
  - id: cap.operations.dag-run-control
    intent: retry/resume 通过历史 runtime facts 和 node outputs 重建输入上下文，optional 历史缺失允许继续，required 历史缺失阻断，统一使用 run_id
    type: capability
  - id: cap.web.dag-run-observability
    intent: Web/CLI 运行观察能力消费 runtime tables 投影出的 edge input 与 source recovery facts
    type: capability
  - id: cap.web.dag-creation
    intent: DAG 创建能力，覆盖前端 dialog 交互和后端 API 创建空 DAG 配置文件
    type: capability
  - id: cap.web.dag-cycle-detection-ui
    intent: 前端环检测，覆盖 onConnect DFS 校验和 toast 警告
    type: capability
  - id: cap.core.edera-cli
    intent: edera CLI 增加普通 EntityType 字段物化的 plan/apply/inspect 维护命令
    type: capability
    domain: dom.core
  - id: cap.operations.llm-session-reuse
    intent: LLM 节点 session 复用机制，覆盖 sandbox 路径管理、session_dir 引用解析、resume 判定和 TTL 清理
    type: capability
    domain: dom.operations
  - id: cap.operations.llm-node-intervention
    intent: LLM 节点侵入式干预，stop + resume with prompt 通过 edera node CLI 命令触发
    type: capability
    domain: dom.operations
  - id: cap.operations.reflection-dag-pattern
    intent: 反思 DAG 模式，cron + idle 触发，通过 edera dag run 与 edera entity query 命令交互目标节点
    type: capability
    domain: dom.operations
  - id: cap.operations.multi-node-retry
    intent: 多节点批量重试能力，覆盖 API 参数泛化、多起点拓扑调度、prefilled 数据加载和前端批量选择交互
    type: capability
  - id: cap.core.dag-resource-semaphore
    intent: DAG 节点资源信号量约束，覆盖 Resource Entity 定义、节点 resource 声明、DagRunner acquire/release 调度逻辑和跨 DAG 共享语义
    type: capability
  - id: cap.core.uzi-skill-dag-instance
    intent: UZI-Skill 分析管道的 DAG 实例配置，覆盖节点声明、边拓扑、resource 引用和 fan-in 模式
    type: capability
  - id: cap.core.legacy-script-adapter
    intent: 通用 LegacyScriptAdapter handler，将 HandlerContext 转为外部 Python 脚本调用约定
    type: capability
  - id: cap.core.node-type-discriminated-union
    intent: NodeConfig discriminated union 在 function/agent/dag 基础上新增 wait variant
    type: capability
  - id: cap.core.agent-executor
    intent: Agent 节点默认获得简短 runtime context，并通过 CLI export 按需获取 payload 文件
    type: capability
  - id: cap.core.sub-dag-execution
    intent: 子 DAG 作为节点嵌套执行，覆盖独立 run_id、parent_run_id 关联、source/sink 接口映射和递归上限
    type: capability
  - id: cap.core.dag-input-parameters
    intent: DAG 输入参数声明，覆盖 inputs schema 定义、source 节点 input_binding、运行时参数注入和 CLI/API/Web 触发
    type: capability
  - id: cap.core.edge-optional
    intent: 边级 optional 是唯一执行语义；DagNodeInstance.optional 与 NodeConfig.optional 作为不同作用域的出边 optional 语法糖
    type: capability
  - id: cap.core.config-hot-reload
    intent: 配置热加载由 edera-server 生命周期管理 HotReloader.watch，成功 reload 以 committed runtime snapshot 事务替换 config、handler registry、entity type registry、trigger/cron 和 runtime read 视图，失败 reload 保留旧 snapshot 且不终止 watcher
    type: capability
  - id: cap.core.edera-server-grpc
    intent: edera-server 后端引擎 gRPC 服务，bootstrap bind 固定 127.0.0.1，端口从 9091 有界退避并写入本机 bootstrap.json，继续覆盖 mTLS、agent/BFF 短期证书签发与 dev 模式
    type: capability
    domain: dom.core
  - id: cap.web.edera-web-bff
    intent: edera-web 网页 BFF，作为服务端本机进程从 EDERA_DATA_DIR/bootstrap.json 发现 bootstrap 端口获取 BFF cert，所有 HTTP route handler 纯 gRPC 调用
    type: capability
    domain: dom.web
  - id: cap.core.bff-web-gateway
    intent: BFF Web 网关，作为 gRPC client 连 edera-server，BFF cert 通过本机 bootstrap 获取并仅驻内存（不落盘），EDERA_DEV=1 模式跳过 token 验证
    type: capability
  - id: cap.core.agent-realtime-observability
    intent: Agent 节点实时可观测，覆盖 stdout event bus、SSE 推送和 Web Console 展示
    type: capability
  - id: cap.core.daemon-data-directory
    intent: edera-server 数据目录管理使用 EDERA_DATA_DIR（default ~/.local/share/edera-server/），与客户端 ~/.edera/ 物理分离；控制面证书与连接环境变量统一使用 EDERA_* 前缀
    type: capability
  - id: cap.core.project-identity
    intent: Edera 项目 canonical identity，覆盖项目名、slug、包命名、命令名（edera/edera-server/edera-web 三件套，移除 rig 别名）、环境变量前缀、默认路径和 README 名称来源说明
    type: capability
  - id: cap.core.runtime-input-context
    intent: Runtime facts 以具体表持久化并投影为 runtime entities，同时明确运行中调度状态以内存 runtime state 和 committed snapshot 为准
    type: capability
  - id: cap.web.source-health-monitoring
    intent: 信息源健康与执行日志能力，覆盖 source health API、source recovery 状态和信息源日志契约
    type: capability
  - id: cap.web.sources-monitor-ui
    intent: 信息源监控页面能力，覆盖信息源健康摘要、执行日志、错误态和用户可读状态展示
    type: capability
  - id: cap.core.grpc-graph-service
    intent: GraphService 提供 DAG/node type/skill/handler CRUD 和 runtime-status；ListHandlers 从 handler_registry 返回 handler 列表；GetHandler/SaveHandler 通过 registry 查找 handler 路径；DagNodeInstance.optional 与 DagEdge.optional 在 round-trip 中保留
    type: capability
  - id: cap.core.grpc-config-service
    intent: gRPC ConfigService，覆盖 system config、entity-types config 和通用配置文件的读写，验证逻辑在 server 端执行
    type: capability
  - id: cap.core.grpc-query-service
    intent: gRPC QueryService，覆盖 briefings/advices/results/sources health/source logs/node-outputs/history 等 DB 查询
    type: capability
  - id: cap.core.grpc-control-services
    intent: gRPC 控制面服务，覆盖 DagService run/stop/retry、SystemService scheduler/source repair task 和 EventService emit
    type: capability
  - id: cap.core.trigger-expression-language
    intent: 触发器布尔表达式语言（AND/OR/括号），cron token 引号语义，bit→trigger 反向索引求值
    type: capability
  - id: cap.core.event-group-engine
    intent: FreeRTOS 风格事件组持久化引擎，覆盖 set/clear/consume bit 状态、DB 存储与重启恢复
    type: capability
  - id: cap.core.cron-emitter
    intent: 内置 cron 时钟 emitter，按 trigger 表达式中声明的 cron token 自动 emit 事件，错过即跳过
    type: capability
  - id: cap.core.event-emit-rpc
    intent: emit 路径在置位 bit 后额外驱动 WaitRegistry 求值，作为 run 内挂起 wait 节点的唤醒入口
    type: capability
  - id: cap.core.trigger-loop-guard
    intent: emit 深度计数器与可配阈值（max_trigger_depth），循环触发防护机制
    type: capability
  - id: cap.core.manual-trigger-prefix
    intent: manual:dag:* / manual:node:* 保留前缀的直接 fire 语义，绕过 wait_for 匹配
    type: capability
  - id: cap.core.node-emits-declaration
    intent: Node Type emits 字段声明（含 instance 级覆盖）与 DAG Runner 的条件求值/emit 集成
    type: capability
  - id: cap.web.trigger-workbench-inspector
    intent: Workbench Inspector Triggers tab，覆盖 DAG 级与 node 级 trigger 列表、表达式编辑器、闹钟 picker 与事件 picker
    type: capability
  - id: cap.core.terminology-glossary
    intent: 项目术语表文档，定义所有核心概念的 canonical term、同义词和使用约定
    type: capability
    domain: dom.core
  - id: cap.core.db-backed-core-entities
    intent: 核心配置型 Entity 使用 SQLite DB 作为运行时 source of truth，覆盖 node/dag/trigger/resource 固定 per-type tables、完整列化、YAML import/export/template、runtime snapshot 构建和 raw log index 边界
    type: capability
  - id: cap.core.lazy-entity-type-materialization
    intent: 普通 EntityType 支持 per-type table、attributes_json 承接新增字段、lazy materialized columns、deprecated 字段生命周期和维护命令
    type: capability
  - id: cap.operations.dag-node-wait-input
    intent: wait 节点类型、waiting 运行状态、WaitRegistry 与 emit 解锁通道、信号先到/后到/超时三态、run 隔离命名约定与重启重放恢复
    status: draft
    type: capability
  - id: cap.web.agent-intervention-web
    intent: Web Console agent 交互弹窗、运行中中断+注入与已结束直接发送两种干预编排、前端干预 hooks 与实时状态展示
    status: draft
    type: capability
