schema_version: 1
project:
  id: proj.edera
  name: Edera
  intent: 以 Entity 为统一原语、以 DAG 为执行模型的通用编排内核，覆盖本机 Web 控制台、配置管理、数据持久化、DAG 运行和控制面能力
  scope: 覆盖 Edera 应用、配置、运行时管道、Web API 和 OpenSpec 跟踪制品
  roots:
    - path: .
domains:
  - id: dom.web
    intent: 本机 Web 控制台 — 页面、API、本机访问边界
    type: domain
    boundary: 拥有 Web 控制台、API 和前端交互，不拥有管道执行逻辑
  - id: dom.operations
    intent: 管道操作面 — 调度控制、手动运行、停止运行和状态记录
    type: domain
    boundary: 拥有运行控制、调度状态和节点执行编排
  - id: dom.advisory
    intent: 交易建议域 — 建议生成、历史复盘与建议质量评估
    type: domain
    boundary: 拥有交易建议和建议质量评估，不拥有原始采集配置
  - id: dom.config
    intent: 配置管理域 — 分层配置体系与运行时编辑
    type: domain
    boundary: 拥有配置读取、校验、编辑和持久化
  - id: dom.data
    intent: 数据层 — 共享模型与持久化
    type: domain
    boundary: 拥有数据模型、数据库表、迁移和查询接口
  - id: dom.core
    intent: 核心实体与运行时编排域，承载统一 Entity、DAG、Trigger 和配置安全能力
    type: domain
    boundary: 拥有统一 Entity 原语、DAG/Trigger 编排和跨层运行时能力
capabilities:
  - id: cap.web.local-web-console
    intent: edera-web 纯 BFF HTTP API 服务器，--bind/--port flag 优先 + EDERA_WEB_BIND/PORT env fallback，default 127.0.0.1:8000，FastAPI/OpenAPI title 使用 Edera，不读 system.toml web 字段
    type: capability
    domain: dom.web
  - id: cap.web.result-explorer
    intent: 结果浏览能力，覆盖统一输出 Entity 下的简报、建议、分析、原文、失败信息、metadata bar、历史简报、dashboard 摘要、事件表格、字符串深链标识和错误/空态展示
    type: capability
    domain: dom.web
  - id: cap.web.dag-workbench-ui
    intent: DAG 工作台 UI 支持将 DAG 作为可拖入节点候选、保留父节点实例上下文的 sub-DAG 导航，以及节点实例循环配置区块与画布循环徽标。
    type: capability
    domain: dom.web
  - id: cap.web.canvas-interaction-enhancement
    intent: 画布右键菜单支持对 sub-DAG 节点执行实例作用域的“进入 Sub DAG”操作。
    type: capability
    domain: dom.web
  - id: cap.web.node-visual-system
    intent: 节点视觉系统，覆盖 alias 优先的 Canvas 节点标题、type-driven 视觉家族、role-driven 动态 Handle、运行状态 badge 和分组可视化
    type: capability
    domain: dom.web
  - id: cap.web.graph-layout-engine
    intent: 图布局引擎，覆盖 ELK 自动布局、全局视口拟合、缩放边界和执行路径高亮
    type: capability
    domain: dom.web
  - id: cap.web.node-graph-dag-editor
    intent: Web Console 增加临时输入配置 UI
    type: capability
    domain: dom.web
  - id: cap.web.node-instance-model
    intent: 节点实例化模型覆盖 sub-DAG 实例的 dag_ref/input_mapping 持久化、多实例引用同一 DAG，以及 DagNodeInstance.config.session 字段（替代已废弃 session_dir）的语法校验
    type: capability
    domain: dom.web
  - id: cap.operations.dag-control
    intent: DAG 控制器增加临时输入参数支持
    type: capability
    domain: dom.operations
  - id: cap.operations.node-executor
    intent: NodeExecutor 使用 DagExecutionSnapshot 中的 handler resolver 解析 `handlers_dir` 下的已安装执行入口；agent 节点执行前解析 session 字段（组名/跨 DAG 引用经注册表），未声明时按 instance_id 推导路径，默认 workdir 为 invocation 目录
    type: capability
    domain: dom.operations
  - id: cap.advisory.trade-advisory
    intent: 交易建议能力，覆盖建议生成、审计字段与历史建议价格复盘
    type: capability
    domain: dom.advisory
  - id: cap.config.runtime-config-editing
    intent: 运行时配置编辑能力，覆盖 portfolio/system/node/dag/skill 配置读取、校验、保存与错误反馈
    type: capability
    domain: dom.config
  - id: cap.data.data-models
    intent: 共享数据模型覆盖 DagRun、NodeRun、NodeOutput、EdgeInput、RawItem、AnalysisResult、Advice、Briefing 和迁移脚本；DagRun.source 仅允许 manual、retry、trigger:<name>
    type: capability
    domain: dom.data
  - id: cap.entity-management-page
    intent: 实体管理页面适配统一 Entity 模型，支持所有 EntityType（含 Node、DAG、Trigger）、Node type、Function handler 和 Skill 的 CRUD 交互
    type: capability
    domain: dom.core
  - id: cap.entity-type-crud-api
    intent: Entity Type CRUD API，cascade delete 降低事务性承诺为顺序持久化
    type: capability
    domain: dom.core
  - id: cap.entity-instance-crud-api
    intent: "Entity Instance CRUD API 适配三层存储路由，GET /api/entities 返回 {entities: [...]} 包装格式，entity payload 包含 display 字段（按 EntityType display_template 渲染），写操作完成后 emit event:entity-changed:{ref}"
    type: capability
    domain: dom.core
  - id: cap.entity-relation-crud-api
    intent: "Entity Relation 统一为 Entity（type: relation），GET /api/entity-relations 返回 {relations: [...]} 包装格式并转换为 {id, entities, type, metadata} 结构，GET /api/entity-relations/types 返回 {types: [...]} 包装格式，type=relation 查询正确路由，通过 Entity Store 管理"
    type: capability
    domain: dom.core
  - id: cap.unified-entity-model
    intent: EntityStore 统一从数据库查询所有 entities 和 relations，不涉及文件系统
    type: capability
  - id: cap.entity-storage-tiers
    intent: Entity 三层存储中核心配置型 Entity 迁移为 DB-backed per-type tables，YAML 仅作为 import/export/template 格式；输出型 Entity 和瞬态 Entity 边界保持独立
    type: capability
  - id: cap.trigger-system
    intent: Trigger target 中的 node 目标使用 node:<dag_name>/<node_id>，不再支持全局 node:<id> 反查。
    type: capability
  - id: cap.dag-condition-branch
    intent: DAG edge 条件分支，可替换 condition evaluator handler，支持 output.* + entity ref + 常量
    type: capability
  - id: cap.single-node-loop
    intent: 单节点并行循环（同输入多实例，until 封顶短路取消）和串行循环（迭代精炼），并发由 resource permits 以迭代为持有单元控制，loop/resource 作为实例顶层字段经 graph API 往返保真
    type: capability
  - id: cap.sub-dag-execution
    intent: 子 DAG 作为 Node 嵌套执行，对外黑盒，递归上限可配置
    type: capability
  - id: cap.config-git-safety
    intent: 配置文件夹强制 git 版本管理，DAG run 结束自动 commit，操作互斥锁
    type: capability
  - id: cap.entity-type-protection
    intent: 系统内核 entity type 的保护机制，覆盖 system_protected 字段声明、后端 403 拒绝和前端只读展示
    type: capability
  - id: cap.core.extension-manifest-system
    intent: Manifest schema 支持 type、imports.providers、imports.libraries 字段，imports 路径支持 glob patterns
    type: capability
  - id: cap.core.core-bootstrap
    intent: 核心 bootstrap 和启动入口迁移到 Edera 命名，核心包为 edera_core，项目主入口命令为 edera
    type: capability
  - id: cap.core.handler-context-protocol
    intent: HandlerContext 增加 runtime API，用于 source fetcher 等 handler 显式记录运行期事实
    type: capability
  - id: cap.core.extension-declarative-storage
    intent: 扩展声明表继续使用 ext_ 命名空间，并与普通 EntityType 的 entity_ per-type table DDL 和列类型契约保持兼容
    type: capability
  - id: cap.operations.dag-event-driven-executor
    intent: dispatcher 将 wait 节点作为常规 Task 调度，挂起不阻塞主循环与独立路径，stop 时可取消挂起
    type: capability
  - id: cap.operations.dag-run-control
    intent: retry/resume 通过历史 runtime facts 和 node outputs 重建输入上下文，optional 历史缺失允许继续，required 历史缺失阻断，统一使用 run_id
    type: capability
  - id: cap.web.dag-run-observability
    intent: Web 运行观察能力支持按 child run_id 展示 sub-DAG 内部节点状态，避免同名子 DAG 在不同父实例间状态串线。
    type: capability
  - id: cap.web.dag-creation
    intent: DAG 创建能力，覆盖前端 dialog 交互和后端 API 创建空 DAG 配置文件
    type: capability
  - id: cap.web.dag-cycle-detection-ui
    intent: 前端环检测，覆盖 onConnect DFS 校验和 toast 警告
    type: capability
  - id: cap.core.edera-cli
    intent: edera CLI 提供完整控制面子命令集（Entity/Relation/Entity-type/DAG/Node/Node-type/Skill/Event/System/Client/Config/Handler/Query/Source/Extension），覆盖 CRUD、文件操作、DAG 定义管理与运行时编辑、物化维护、扩展生命周期、查询与监控，通过 gRPC 客户端连接 server，支持 mTLS 身份认证、分页展示、watch/tail 模式和结构化错误输出。
    type: capability
    domain: dom.core
  - id: cap.operations.llm-session-reuse
    intent: Agent 节点 session 关联模型，覆盖 session 字段（组名 + 跨 DAG 有向引用）、组共享路径与精确续接、隐式 resource 组串行、session run 注册表、@latest/@list 解析与消费账本
    type: capability
    domain: dom.operations
  - id: cap.operations.llm-node-intervention
    intent: LLM 节点侵入式干预，stop + resume with prompt 通过 edera node CLI 命令触发
    type: capability
    domain: dom.operations
  - id: cap.operations.reflection-dag-pattern
    intent: 反思 DAG 模式，cron + idle 触发，通过 edera dag run 与 edera entity query 命令交互目标节点
    type: capability
    domain: dom.operations
  - id: cap.operations.multi-node-retry
    intent: 多节点重试 API 和 CLI 均支持临时输入参数，包括 sourceSharedInputs、nodeInputs 和 appendNodes。
    type: capability
  - id: cap.core.dag-resource-semaphore
    intent: DAG 节点资源信号量约束，覆盖 Resource Entity 定义、节点 resource 声明、DagRunner acquire/release 调度（循环节点外壳不持锁）、阻塞式 acquire 与精确唤醒、跨 DAG 共享语义
    type: capability
  - id: cap.core.uzi-skill-dag-instance
    intent: uzi-skill manifest 使用 glob patterns 替代 59 行手动列举
    type: capability
  - id: cap.core.legacy-script-adapter
    intent: 通用 LegacyScriptAdapter handler，将 HandlerContext 转为外部 Python 脚本调用约定
    type: capability
  - id: cap.core.node-type-discriminated-union
    intent: NodeConfig discriminated union 在 function/agent/dag 基础上新增 wait variant
    type: capability
  - id: cap.core.agent-executor
    intent: Agent 节点 pi CLI subprocess 契约，覆盖 --session 精确续接、invocations/{node_id} 逐次产物命名空间、结构化输出契约（result_path + output_schema 校验与降级）、runtime context 注入与实时 stdout streaming
    type: capability
  - id: cap.core.sub-dag-execution
    intent: Sub-DAG 执行的 input_mapping 支持 dict 或 entity 引用
    type: capability
  - id: cap.core.dag-input-parameters
    intent: 运行时参数传递机制，移除 DAG.inputs 和 input_binding，改用 sourceSharedInputs 和 nodeInputs
    type: capability
  - id: cap.core.edge-optional
    intent: 边级 optional 是唯一执行语义；DagNodeInstance.optional 与 NodeConfig.optional 作为不同作用域的出边 optional 语法糖
    type: capability
  - id: cap.core.config-hot-reload
    intent: 配置热加载只重建 committed RuntimeControlSnapshot 的常驻控制面状态；handler 代码来源为已安装 `handlers_dir`，extension lifecycle 成功后影响后续 DAG run 的 DagExecutionSnapshot。
    type: capability
  - id: cap.core.edera-server-grpc
    intent: edera-server 后端引擎 gRPC 服务，bootstrap bind 固定 127.0.0.1，端口从 9091 有界退避并写入本机 bootstrap.json，相关测试不依赖 legacy registry fake。
    type: capability
    domain: dom.core
  - id: cap.web.edera-web-bff
    intent: Web BFF API 增加临时输入参数
    type: capability
    domain: dom.web
  - id: cap.core.agent-realtime-observability
    intent: Agent 节点实时可观测，覆盖 stdout event bus、SSE 推送和 Web Console 展示
    type: capability
  - id: cap.core.daemon-data-directory
    intent: edera-server 数据目录管理使用 EDERA_DATA_DIR（default ~/.local/share/edera-server/），与客户端 ~/.edera/ 物理分离；控制面证书与连接环境变量统一使用 EDERA_* 前缀
    type: capability
  - id: cap.core.project-identity
    intent: Edera 项目 canonical identity，覆盖项目名、slug、包命名、命令名（edera/edera-server/edera-web 三件套，移除 rig 别名）、环境变量前缀、默认路径和 README 名称来源说明
    type: capability
  - id: cap.core.runtime-input-context
    intent: Runtime facts 以具体表持久化并投影为 runtime entities，agent 可通过 edera node output export 显式导出指定 run/node 的业务 payload。
    type: capability
  - id: cap.web.source-health-monitoring
    intent: 信息源健康与执行日志能力，覆盖 source health API、source recovery 状态、信息源日志契约、监控页面展示和错误反馈
    type: capability
  - id: cap.core.grpc-graph-service
    intent: GraphService 的 DAG/Node/Skill 读写使用 DB-backed source of truth，SaveDag 只校验 candidate reachable sub-DAG closure，并在保存后 emit config-changed。
    type: capability
  - id: cap.core.grpc-config-service
    intent: ConfigService 删除 ReloadEntityTypes 和 ReloadSkills，EntityType/Skill 以 DB-backed source of truth 生效。
    type: capability
  - id: cap.core.grpc-query-service
    intent: QueryService runtime read validation 使用 DB-backed repositories 和 runtime facts，不依赖 runtime_snapshot().config DAG/Node mirror。
    type: capability
  - id: cap.core.grpc-control-services
    intent: gRPC 控制面服务覆盖 DagService run/stop/retry、SystemService scheduler/source repair task、EventService emit，并由 edera system CLI 暴露 source repair task 创建入口。
    type: capability
  - id: cap.core.trigger-expression-language
    intent: 触发器布尔表达式语言（AND/OR/括号），cron token 引号语义，bit→trigger 反向索引求值
    type: capability
  - id: cap.core.event-group-engine
    intent: FreeRTOS 风格事件组持久化引擎，覆盖 set/clear/consume bit 状态、DB 存储与重启恢复
    type: capability
  - id: cap.core.cron-emitter
    intent: 内置 cron 时钟 emitter，按 trigger 表达式中声明的 cron token 自动 emit 事件，错过即跳过
    type: capability
  - id: cap.core.event-emit-rpc
    intent: emit 路径在置位 bit 后额外驱动 WaitRegistry 求值，作为 run 内挂起 wait 节点的唤醒入口
    type: capability
  - id: cap.core.trigger-loop-guard
    intent: emit 深度计数器与可配阈值（max_trigger_depth），循环触发防护机制
    type: capability
  - id: cap.core.manual-trigger-prefix
    intent: manual:node 触发增加 append 参数支持
    type: capability
  - id: cap.core.node-emits-declaration
    intent: Node Type emits 字段声明（含 instance 级覆盖）与 DAG Runner 的条件求值/emit 集成
    type: capability
  - id: cap.web.trigger-workbench-inspector
    intent: Workbench Inspector Triggers tab 在 node 视图生成和过滤 target=node:<dag_name>/<node_id> 的 trigger entity。
    type: capability
  - id: cap.core.terminology-glossary
    intent: 项目术语表文档，定义所有核心概念的 canonical term、同义词和使用约定
    type: capability
    domain: dom.core
  - id: cap.core.db-backed-core-entities
    intent: DB 是 DAG/Node/Trigger/Resource、EntityType 和 Skill 的运行时 source of truth；DAG/Node/EntityType/Skill 不进入 RuntimeControlSnapshot。
    type: capability
  - id: cap.core.lazy-entity-type-materialization
    intent: 普通 EntityType 支持 per-type table、attributes_json 承接新增字段、lazy materialized columns、deprecated 字段生命周期和维护命令
    type: capability
  - id: cap.operations.dag-node-wait-input
    intent: wait 节点类型、waiting 运行状态、WaitRegistry 与 emit 解锁通道、信号先到/后到/超时三态、run 隔离命名约定与重启重放恢复
    status: draft
    type: capability
  - id: cap.web.agent-intervention-web
    intent: Web Console agent 交互弹窗、运行中中断+注入与已结束直接发送两种干预编排、前端干预 hooks 与实时状态展示
    status: draft
    type: capability
  - id: cap.core.extension-entity-imports
    intent: 扩展安装时导入 Entity 实例，导入记录合并到 installed_extensions.import_records JSON 字段
    type: capability
  - id: cap.core.default-news-workflow
    intent: default-news-workflow 重组为 workflow extension 包结构，manifest 使用 glob patterns，包含 7 个内部 providers 和 _lib
    type: capability
  - id: cap.core.uzi-subdag-structure
    intent: UZI-Skill 分层 Sub DAG 结构，定义数据采集、评分综合、渲染三阶段的子图组织和数据流契约
    type: capability
  - id: cap.core.subdag-cycle-error-detail
    intent: 增强 Sub DAG 循环检测错误消息，提供节点级路径追踪和具体修复建议
    type: capability
  - id: cap.core.extension-installation-lifecycle
    intent: 安装逻辑识别 workflow_extension 类型，递归处理 imports.providers，复制 imports.libraries，展开所有 glob patterns
    type: capability
  - id: cap.core.extension-grpc-service
    intent: InstallExtension RPC 支持 workflow_extension 类型，递归处理 providers，展开 glob patterns
    type: capability
  - id: cap.web.extension-management-web
    intent: WebConsole 扩展管理页面，展示可用/已安装扩展，支持安装、卸载、导入、导出操作
    type: capability
  - id: cap.core.database-handler-resolver
    intent: Handler resolver 支持 {package}.{handler} 命名空间路径查找
    type: capability
  - id: cap.core.dag-execution-snapshot
    intent: DAG run 启动时由 DagController 构建 DAG execution closure，并在 DagExecutionSnapshot 中冻结 DAG/Node 闭包、entity_types、handler resolver、extension table mapping 和 run-needed skills。
    type: capability
  - id: cap.core.ordinary-entity-database-storage
    intent: 普通 entities 存储到数据库动态表，按 entity type 分表
    type: capability
  - id: cap.core.entity-relations-database-storage
    intent: Entity relations 存储到 entity_relations 表
    type: capability
  - id: cap.core.skill-database-storage
    intent: Skills 存储到 skills 数据库表
    type: capability
  - id: cap.core.skill-dynamic-generation
    intent: Agent 执行时从数据库动态生成 skill 文件
    type: capability
  - id: cap.core.runtime-skill-reload
    intent: 运行时刷新 skill 配置的 API
    type: capability
  - id: cap.core.runtime-temporary-input
    intent: 运行时临时输入机制，支持 sourceSharedInputs、nodeInputs、appendNodes 三种参数，覆盖或追加节点输入
    type: capability
  - id: cap.core.input-mapping-entity
    intent: InputMapping 核心 Entity Type，用于 Sub-DAG 的持久化输入映射配置
    type: capability
  - id: cap.core.extension-glob-imports
    intent: Manifest imports 支持 glob patterns 用于批量匹配 entity 文件路径
    type: capability
  - id: cap.core.workflow-extension-type
    intent: 识别 workflow_extension 类型并递归处理 imports.providers 和 imports.libraries
    type: capability
  - id: cap.core.handler-namespace
    intent: Handler 使用包点处理器命名空间路径避免冲突
    type: capability
  - id: cap.core.extension-testing-framework
    intent: 提供 edera-testing 测试框架包，包含 fixtures（extension_runtime、mock_pi_binary、mock_handler_context、mock_entity_store）、assertions（assert_handler_signature、assert_manifest_valid）和 mocks（FakePIBinary、MockScript），供扩展开发者编写独立测试
    type: capability
  - id: cap.core.extension-test-template
    intent: 提供扩展测试模板，包含 conftest.py.template、pytest.ini.template、test_handler_unit.py.template、test_dag_e2e.py.template 和详细的 README.md，规范扩展测试结构和最佳实践
    type: capability
  - id: cap.core.session-relay-test-extension
    intent: 测试扩展 session-relay-test，提供 relay-main（同 DAG session 组接力 + 条件边）与 relay-skill（跨 DAG @latest/@list 引用消费）两个 DAG 及配套 function handler
    type: capability
