      intent: edera CLI 提供完整控制面子命令集，覆盖 CRUD、文件操作、DAG 定义管理与运行时编辑、物化维护、扩展生命周期、查询与监控，通过 gRPC 客户端连接 server，支持 mTLS 身份认证、分页展示、watch/tail 模式和结构化错误输出；同时在顶层、一级子命令、二级子命令、三级子命令四个层级暴露文档化的 help 文本（description、EXAMPLES、subcommand 一行说明、全部参数 help= 含格式标注），所有 add_argument() 和 add_parser() 调用均包含 help= 文本
