schema_version: 1
ADDED:
  capabilities:
    - id: cap.core.node-type-discriminated-union
      type: capability
      intent: NodeConfig Discriminated Union 模型，覆盖 function/agent/dag 三种变体的字段定义、Pydantic 判别器和 YAML 反序列化
    - id: cap.core.agent-executor
      type: capability
      intent: Agent 节点独立执行分支，覆盖 subprocess 启动、stdout 实时 streaming、stop/resume 生命周期和 workdir/session 分离
    - id: cap.core.sub-dag-execution
      type: capability
      intent: 子 DAG 作为节点嵌套执行，覆盖独立 cycle_id、parent_cycle_id 关联、source/sink 接口映射和递归上限
    - id: cap.core.dag-input-parameters
      type: capability
      intent: DAG 输入参数声明，覆盖 inputs schema 定义、source 节点 input_binding、运行时参数注入和 CLI/API/Web 触发
    - id: cap.core.edge-optional
      type: capability
      intent: 边级和节点级 optional 属性，覆盖 fan-in barrier 容错判定、节点级语法糖展开和错误路径隔离
    - id: cap.core.config-hot-reload
      type: capability
      intent: 全量配置热加载，覆盖 file watch、增量重载、handler 模块缓存清除和 manifest 重新扫描
    - id: cap.core.rig-daemon-grpc
      type: capability
      intent: Rig daemon gRPC 服务，覆盖 service 定义、mTLS 传输、agent 短期证书签发和 dev 模式
    - id: cap.core.rig-cli-full-crud
      type: capability
      intent: Rig CLI 完整 CRUD，覆盖 entity create/delete、dag status/edit、node output 和 client init
    - id: cap.core.bff-web-gateway
      type: capability
      intent: BFF Web 网关，覆盖 gRPC client 转 HTTP/SSE、token 认证和 dev 模式免认证
    - id: cap.core.agent-realtime-observability
      type: capability
      intent: Agent 节点实时可观测，覆盖 stdout event bus、SSE 推送和 Web Console 展示
  relations:
    - from: cap.core.node-type-discriminated-union
      type: contains
      to: dom.core
    - from: cap.core.agent-executor
      type: contains
      to: dom.core
    - from: cap.core.sub-dag-execution
      type: contains
      to: dom.core
    - from: cap.core.dag-input-parameters
      type: contains
      to: dom.core
    - from: cap.core.edge-optional
      type: contains
      to: dom.core
    - from: cap.core.config-hot-reload
      type: contains
      to: dom.core
    - from: cap.core.rig-daemon-grpc
      type: contains
      to: dom.core
    - from: cap.core.rig-cli-full-crud
      type: contains
      to: dom.core
    - from: cap.core.bff-web-gateway
      type: contains
      to: dom.core
    - from: cap.core.agent-realtime-observability
      type: contains
      to: dom.core

MODIFIED:
  capabilities:
    - id: cap.operations.node-executor
      intent: 节点执行器，按 NodeConfig type 分发执行（function 走 handler registry，agent 走 subprocess，dag 走递归），支持 agent 节点 workdir/session 分离
    - id: cap.operations.dag-event-driven-executor
      intent: DAG 事件驱动执行器，fan-in barrier 增加 edge optional 判定逻辑
    - id: cap.core.core-bootstrap
      intent: 核心 bootstrap，逻辑可重入，支持运行时重新扫描和 registry 原子替换
    - id: cap.core.rig-cli
      intent: Rig CLI，从 HTTP client 改为 gRPC client，增加 daemon 连接管理和证书配置
    - id: cap.operations.pipeline-control
      intent: 管道控制能力，DAG 运行 API 增加 inputs 参数传递
    - id: cap.entity-type-crud-api
      intent: Entity Type CRUD API，cascade delete 降低事务性承诺为顺序持久化

REMOVED:
  capabilities: []
