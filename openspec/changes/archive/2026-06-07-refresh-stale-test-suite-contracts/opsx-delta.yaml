schema_version: 1
ADDED:
  capabilities: []
  relations: []

MODIFIED:
  capabilities:
    - id: cap.core.extension-manifest-system
      intent: Bootstrap 流程扫描 extension manifest 并持久化 extension metadata，运行时通过 DB-backed resolver 使用 metadata，不再构建 HandlerRegistry 和 EntityTypeRegistry。
    - id: cap.operations.node-executor
      intent: NodeExecutor 使用 DagExecutionSnapshot 中的 handler resolver 解析执行入口，测试和实现不再依赖 HandlerRegistry 或旧 handlers 构造路径。
    - id: cap.core.edera-cli
      intent: edera CLI 提供 Entity、DAG、Event、System、Node、Extension 控制能力；Entity import 通过 gRPC entity import RPC 提交完整 Entity YAML。
    - id: cap.core.edera-server-grpc
      intent: edera-server 后端引擎 gRPC 服务，bootstrap bind 固定 127.0.0.1，端口从 9091 有界退避并写入本机 bootstrap.json，相关测试不依赖 legacy registry fake。

