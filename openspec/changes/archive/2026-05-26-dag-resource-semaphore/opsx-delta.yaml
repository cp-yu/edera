schema_version: 1
ADDED:
  capabilities:
    - id: cap.core.dag-resource-semaphore
      type: capability
      intent: DAG 节点资源信号量约束，覆盖 Resource Entity 定义、节点 resource 声明、DagRunner acquire/release 调度逻辑和跨 DAG 共享语义
  relations:
    - from: cap.core.dag-resource-semaphore
      type: contains
      to: dom.core

MODIFIED:
  capabilities:
    - id: cap.operations.dag-event-driven-executor
      intent: 事件驱动 DAG 调度器，覆盖 dispatcher 调度、fan-in barrier/accumulate 模式、错误路径隔离、resource semaphore gate 和执行结果收集
