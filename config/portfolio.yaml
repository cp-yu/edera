targets:
  - code: "00700.HK"
    name: "Tencent"
    holding:
      quantity: 100
      cost_price: 300
    sources:
      - sample-rss
      - sample-web
      - minimax-docs
  - code: "600519.SH"
    name: "Kweichow Moutai"
    sources:
      - sample-rss
      - minimax-docs
sources:
  - name: sample-rss
    type: rss
    url: https://example.com/feed.xml
  - name: sample-web
    type: web
    url: https://example.com/announcements.html
    regex: '<article>(?P<title>.*?)</article>'
  - name: minimax-docs
    type: web
    url: https://platform.minimax.io/docs/api-reference/text-chat-openai
    regex: '<main[^>]*>.*?(?P<title>Text Chat \(Compatible OpenAI API\)).*?(?P<content>Bearer Auth.*?MiniMax-M2\.7.*?)</main>'
