[project]
name = "stockimformation-core"
version = "0.1.0"
description = "Core runtime for stockImformation"
requires-python = ">=3.12"
dependencies = [
    "stockimformation-types",
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "cryptography>=42.0.0",
    "grpcio>=1.64.0",
    "grpcio-tools>=1.64.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.6",
    "watchfiles>=0.24.0",
]

[tool.uv.sources]
stockimformation-types = { workspace = true }

[project.scripts]
stockimformation = "stockimformation_core.main:main"
rig = "stockimformation_core.rig_cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
