[project]
name = "edera-testing"
version = "0.1.0"
description = "Testing helpers for Edera extensions"
requires-python = ">=3.12"
dependencies = [
    "edera-core>=0.1.0",
    "edera-types>=0.1.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.uv.sources]
edera-core = { workspace = true }
edera-types = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
