[project]
name = "stockimformation"
version = "0.1.0"
description = "Personal stock information pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20.0",
    "alembic>=1.13.3",
    "apscheduler>=3.10.4",
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.2",
    "jinja2>=3.1.4",
    "pydantic-settings>=2.5.2",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0.2",
    "sqlmodel>=0.0.22",
    "uvicorn>=0.30.6",
]

[project.scripts]
stockimformation = "stockimformation.main:main"

[dependency-groups]
dev = [
    "mypy>=1.11.2",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "_bmad",
    "_bmad-output",
    ".venv",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["stockimformation"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.schedulers.asyncio",
    "feedparser",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
