[tool.uv.workspace]
members = [
    "packages/core",
    "packages/core-types",
    "packages/edera-testing",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "_bmad",
    "_bmad-output",
    ".venv",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["edera_core", "edera_types", "edera_testing"]

[[tool.mypy.overrides]]
module = [
    "apscheduler.schedulers.asyncio",
    "feedparser",
    "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
