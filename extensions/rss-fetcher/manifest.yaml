name: rss-fetcher
version: 0.1.0
depends: [_lib/http_fetch]
handlers:
  - name: fetch-rss
    entry: handler.py
    role: source
    input_type: Any
    output_type: list[RawItem]
entity_types:
  - name: rss-source
    display_name: RSS 信息源
    business_id_field: name
    display_template: "{name}"
    storage_tier: database
    schema:
      type: object
      required: [name, url]
      properties:
        name: {type: string}
        url: {type: string}
